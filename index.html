<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Desy — Your Creative Workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html
<!doctype html>
<html lang="en">
  <head>
    <!-- Makes sure text and special characters display correctly -->
    <meta charset="UTF-8" />

    <!-- Helps Desy display properly on different screen sizes -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- The name that appears in your browser tab -->
    <title>Desy — Your Creative Workspace</title>

    <!-- Connect to Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Use the Inter font throughout Desy -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- This is where the React app appears -->
    <div id="root"></div>

    <!-- Starts Desy by loading the main React file -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
